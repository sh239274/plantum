name: plantom
description: "Plantom (پلنتوم) - Comprehensive Cross-Platform Personal Productivity and Planning System for Windows, Android, iOS and Web"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Reactive Architecture
  flutter_riverpod: ^2.5.1

  # Local Offline-first SQLite Persistence
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # High-Precision Dual-Calendar (Jalali & Gregorian)
  shamsi_date: ^1.0.1
  intl: ^0.19.0

  # Modern UI, Typography, Icons & Audio
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  audioplayers: ^6.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
